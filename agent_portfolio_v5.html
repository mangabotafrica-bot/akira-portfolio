<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aboubacar — Akira.AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff;
    color: #111;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 14px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .header-info { flex: 1; }
  .header-name { font-size: 14px; font-weight: 600; }
  .header-sub { font-size: 12px; color: #999; margin-top: 1px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg { display: flex; gap: 9px; }
  .msg.user { flex-direction: row-reverse; }

  .msg-av {
    width: 26px; height: 26px;
    border-radius: 50%;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg.bot .msg-av { background: #111; color: #fff; }
  .msg.user .msg-av { background: #eee; color: #111; }

  .bubble {
    max-width: 74%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .msg.bot .bubble { background: #f4f4f4; border-radius: 4px 16px 16px 16px; }
  .msg.user .bubble { background: #111; color: #fff; border-radius: 16px 4px 16px 16px; }
  .msg.system { justify-content: center; }
  .msg.system .bubble { background: none; color: #ccc; font-size: 12px; padding: 0; max-width: 100%; text-align: center; }

  .dots { display: flex; gap: 4px; align-items: center; padding: 10px 13px; }
  .dots span { width: 6px; height: 6px; background: #bbb; border-radius: 50%; animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }

  .suggestions {
    padding: 0 20px 10px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .sugg {
    border: 1px solid #e5e5e5; border-radius: 20px;
    padding: 5px 13px; font-size: 13px;
    color: #555; background: #fff;
    cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .sugg:hover { background: #111; color: #fff; border-color: #111; }

  .input-area {
    padding: 10px 20px 18px;
    border-top: 1px solid #f0f0f0;
    display: flex; gap: 9px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    border: 1px solid #e5e5e5; border-radius: 12px;
    padding: 9px 13px; font-size: 14px;
    font-family: inherit; outline: none;
    resize: none; background: #fafafa;
    max-height: 96px; line-height: 1.5;
    transition: border .2s;
  }
  textarea:focus { border-color: #111; background: #fff; }
  textarea::placeholder { color: #bbb; }

  button.send {
    width: 38px; height: 38px;
    background: #111; color: #fff;
    border: none; border-radius: 10px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s;
  }
  button.send:disabled { opacity: .25; cursor: default; }
  button.send svg { width: 17px; height: 17px; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">A</div>
  <div class="header-info">
    <div class="header-name">Aboubacar · Akira.AI</div>
    <div class="header-sub">Automatisation IA · Niger</div>
  </div>
  <div class="dot"></div>
</div>

<div class="messages" id="msgs">
  <div class="msg system"><div class="bubble">En ligne</div></div>
  <div class="msg bot">
    <div class="msg-av">A</div>
    <div class="bubble">Bonjour 👋 Je suis l'agent IA d'Aboubacar.<br>Je peux te renseigner sur ses services, tarifs, projets ou disponibilités. Que veux-tu savoir ?<br><br>I also speak English 🇬🇧</div>
  </div>
</div>

<div class="suggestions" id="suggs">
  <button class="sugg" onclick="pick(this,'Quels sont tes tarifs ?')">Tarifs</button>
  <button class="sugg" onclick="pick(this,'Qu\'est-ce que tu sais faire ?')">Services</button>
  <button class="sugg" onclick="pick(this,'Tu as des preuves de ton travail ?')">Preuves</button>
  <button class="sugg" onclick="pick(this,'What can you build for me?')">In English</button>
</div>

<div class="input-area">
  <textarea id="inp" placeholder="Pose ta question…" rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"
    oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,96)+'px'"></textarea>
  <button class="send" id="btn" onclick="send()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
const WH = 'https://n8n-production-0d2a.up.railway.app/webhook/akira-portfolio';

function sid() {
  let s = sessionStorage.getItem('s');
  if (!s) { s = 'u' + Date.now(); sessionStorage.setItem('s', s); }
  return s;
}

async function send() {
  const inp = document.getElementById('inp');
  const btn = document.getElementById('btn');
  const t = inp.value.trim();
  if (!t) return;
  document.getElementById('suggs').style.display = 'none';
  inp.value = ''; inp.style.height = 'auto'; btn.disabled = true;
  addMsg('user', t);
  const tid = typing();
  try {
    const r = await fetch(WH, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:t, sessionId:sid()}) });
    rmTyping(tid);
    if (!r.ok) throw 0;
    const d = await r.json();
    addMsg('bot', d.response || d.output || '…');
  } catch {
    rmTyping(tid);
    addMsg('bot', 'Erreur de connexion. Contacte Aboubacar sur WhatsApp : +227 85 19 42 27');
  }
  btn.disabled = false;
  inp.focus();
}

function pick(el, t) { document.getElementById('inp').value = t; send(); }

function addMsg(type, text) {
  const w = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  if (type === 'system') {
    d.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
  } else {
    const av = type === 'bot' ? 'A' : 'U';
    d.innerHTML = '<div class="msg-av">' + av + '</div><div class="bubble">' + fmt(text) + '</div>';
  }
  w.appendChild(d); w.scrollTop = w.scrollHeight;
}

let tc = 0;
function typing() {
  const w = document.getElementById('msgs');
  const id = 't' + ++tc;
  const d = document.createElement('div');
  d.className = 'msg bot'; d.id = id;
  d.innerHTML = '<div class="msg-av">A</div><div class="bubble"><div class="dots"><span/><span/><span/></div></div>';
  w.appendChild(d); w.scrollTop = w.scrollHeight; return id;
}
function rmTyping(id) { const e = document.getElementById(id); if (e) e.remove(); }

function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t) { return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>'); }
</script>
</body>
</html>
